<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#F5F0E8;--cream-dark:#EDE7D9;--surface:#FDFAF4;
  --burgundy:#6B1A2A;--burg-lo:rgba(107,26,42,0.08);
  --olive:#5C6B3A;--ok:#5C6B3A;--ok-lo:rgba(92,107,58,0.1);
  --warn:#C4694A;
  --text:#1C1410;--muted:#8C7B6A;
  --border:#D8CFBF;--border-hi:#C4B89E;
  --radius:12px;
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Instrument Sans',sans-serif;
  --mono:'DM Mono',monospace;
}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;min-height:100vh}

/* Header */
header{background: linear-gradient(90deg, #c4e0fd 0%, #d9e5df 35%, #f1d9cd 70%, #f3e5c9 100%
100%
) ;padding:0 40px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo-svg{height:40px;display:block}
.header-right{display:flex;align-items:center;gap:20px}
.header-link{font-family:var(--mono);font-size:11px;color:var(--burgundy);text-decoration:none;transition:color .15s}
.header-link:hover{color:#fff}
.engine-badge{font-family:var(--mono);font-size:10px;padding:4px 10px;border-radius:20px;background:var(--burgundy);color:rgba(255,255,255,0.7);letter-spacing:.8px}

/* Page */
.page{max-width:680px;margin:0 auto;padding:48px 32px 100px}

/* Step blocks */
.step{margin-bottom:24px;animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.step-header{display:flex;align-items:center;margin-bottom:16px}
.step-header-text{font-family:var(--serif);font-size:20px;font-weight:500}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:20px}
.card-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-family:var(--serif);font-size:16px;font-weight:500}
.card-body{padding:20px}

/* Pick button */
#pick-btn{width:100%;padding:32px 20px;background:transparent;border:1.5px dashed var(--border-hi);border-radius:var(--radius);color:var(--text);font-family:var(--sans);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:14px;transition:border-color .15s,background .15s,transform .1s}
#pick-btn:hover{border-color:var(--burgundy);background:var(--burg-lo);transform:translateY(-1px)}
#pick-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
#pick-btn .icon{font-size:26px}
#pick-btn .label{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
#pick-btn .label strong{font-weight:600;color:var(--text)}
#pick-btn .label span{font-size:11px;color:var(--muted);font-family:var(--mono)}

/* Status */
#status-bar{display:none;align-items:center;gap:12px;padding:14px 18px;margin-bottom:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:12px;color:var(--muted)}
#status-bar.visible{display:flex}
.spinner{width:16px;height:16px;border:2px solid var(--border-hi);border-top-color:var(--burgundy);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* Result */
#result-card{display:none}
#result-card.visible{display:block}
.sampled-row{display:flex;align-items:center;gap:12px;padding:12px 0;margin-bottom:20px;border-bottom:1px solid var(--border)}
.sampled-swatch{width:36px;height:36px;border-radius:8px;border:1px solid rgba(0,0,0,.1);flex-shrink:0}
.sampled-info{font-family:var(--mono);font-size:12px;color:var(--muted)}
.swatch-compare{display:flex;gap:12px;margin-bottom:20px}
.swatch-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.swatch-col .col-label{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.swatch-box{width:100%;height:72px;border-radius:12px;border:1px solid rgba(0,0,0,.08)}
.match-name{font-family:var(--serif);font-size:16px;font-weight:500;color:var(--text);text-align:center}
.add-btn{padding:11px 22px;background:var(--burgundy);color:#fff;border:none;border-radius:8px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;white-space:nowrap}
.add-btn:hover{opacity:.85}
.add-btn:disabled{opacity:.35;cursor:not-allowed}
.alt-matches{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.alt-label{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.alt-grid{display:flex;flex-wrap:wrap;gap:8px}
.alt-chip{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--cream-dark);border:1.5px solid var(--border);border-radius:8px;cursor:pointer;transition:border-color .15s;font-size:12px}
.alt-chip:hover{border-color:var(--burgundy)}
.alt-chip.selected{border-color:var(--burgundy);background:var(--burg-lo)}
.alt-chip .chip-swatch{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.08)}
.alt-chip .chip-de{font-family:var(--mono);font-size:10px;color:var(--muted)}

/* Palette */
.palette-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.palette-item{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--cream-dark);border:1px solid var(--border);border-radius:10px}
.palette-swatch{width:36px;height:36px;border-radius:8px;border:1px solid rgba(0,0,0,.08);flex-shrink:0}
.palette-name{flex:1;font-size:14px;font-weight:600;color:var(--text)}
.palette-hex{font-family:var(--mono);font-size:11px;color:var(--muted)}
.remove-btn{background:transparent;border:1px solid var(--border-hi);border-radius:5px;color:var(--muted);font-size:11px;padding:3px 8px;cursor:pointer;transition:border-color .15s,color .15s}
.remove-btn:hover{border-color:var(--warn);color:var(--warn)}
.palette-actions{display:flex;gap:10px}
.copy-all-btn{flex:1;padding:13px;background:var(--olive);color:#fff;border:none;border-radius:var(--radius);font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s}
.copy-all-btn:hover{opacity:.85}
.clear-btn{padding:13px 20px;background:transparent;border:1.5px solid var(--border-hi);border-radius:var(--radius);color:var(--muted);font-family:var(--sans);font-size:13px;cursor:pointer;transition:border-color .15s,color .15s}
.clear-btn:hover{border-color:var(--warn);color:var(--warn)}
.empty-palette{text-align:center;padding:28px;font-size:12px;color:var(--muted);font-family:var(--mono)}
</style>
</head>
<body>

<header>
  <svg class="logo-svg" viewBox="0 0 205.3 101" xmlns="http://www.w3.org/2000/svg">
    <path fill="#fff" d="M185.2,24.6c-11.1,0-20.1,9.5-20.1,30s1.1,11.5,2.9,16.3c-.8.5-1.6.7-2.6.7-4.1,0-6-1.4-6-6.9v-24.4c0-8.8-7.2-14.8-16-13.4-3.3.5-6.4,2-9,4.2-2.9-3.3-7.5-5-12.6-4.2-3.3.5-6.4,2-9,4.2-3-3.3-7-4.1-7-4.1l-4.9,10.4c3.8,0,4.8,2.9,4.8,5.3v21.4c0,4.9-2.1,6.8-5.1,6.8s-4.9-1.7-4.9-6.5V27.8h-10.4v38.2c0,4-3.3,7.3-7.3,7.3s-7.3-3.3-7.3-7.3V27.9h-10.4v38.1c0,9.8,7.9,17.7,17.7,17.7s9.9-2.3,13.1-5.9c2.1,1.9,4.9,3.1,8.4,3.1s4.4-.6,6.1-1.7v1.4h10.5v-22.3c0-.2,0-.5,0-.7v-14.1c.1-3,2.6-5.8,5.6-6.3,3.1-.5,5.6,1.6,5.6,4.7v38.7h10.4v-36.9c0-3.1,2.5-6,5.6-6.5,3.1-.5,5.5,1.6,5.5,4.7v22.7c0,13.9,6,18.5,15.2,18.5s7.1-1.6,9.5-3.4c3.3,3,7.2,4.4,11.5,4.4,11.1,0,20.1-6.3,20.1-29.5s-9-30-20.1-30ZM185.2,71.9c-5.4,0-9.8-2.1-9.8-17.3s4.4-17.7,9.8-17.7,9.8,2.6,9.8,17.7-4.4,17.3-9.8,17.3Z"/>
    <path fill="#fff" d="M53.5,80.9V21.4c0-11.4-9.2-20.7-20.6-20.7S15.6,7,13,15.5c-3.5-2.2-7.6-3.5-12-3.5v11.4c6.1,0,11.2,4.9,11.2,11v46.2h11.4v-46.2c0-.4,0-.7,0-1.1v-11.8c0-5.2,3.9-9.1,9.1-9.1s9.5,4.2,9.5,9.5l-.3,59c0,7.9,4.1,14.8,10.2,18.8l7.2-9.3c-3.4-1.8-5.8-5.4-5.8-9.6Z"/>
  </svg>
  <div class="header-right">
    <a href="/" class="header-link">&larr; Production Engine</a>
    <span class="engine-badge">Numo Color Finder</span>
  </div>
</header>

<div class="page">

  <!-- Pick -->
  <div class="step">
    <div class="step-header"><span class="step-header-text">Sample a color</span></div>
    <div class="card">
      <div class="card-body">
        <button id="pick-btn" onclick="launchEyedropper()">
          <span class="icon">&#127919;</span>
          <span class="label">
            <strong>Pick color from screen</strong>
            <span>Click anywhere &mdash; Illustrator, browser, anywhere on screen</span>
          </span>
        </button>
      </div>
    </div>
  </div>

  <!-- Status -->
  <div id="status-bar"><div class="spinner"></div><span id="status-text">Matching&hellip;</span></div>

  <!-- Result -->
  <div class="step" id="result-card">
    <div class="step-header"><span class="step-header-text">Best match</span></div>
    <div class="card">
      <div class="card-header" style="justify-content:flex-end">
        <button class="add-btn" id="add-btn" onclick="addToPalette()">+ Add to palette</button>
      </div>
      <div class="card-body">
        <div class="swatch-compare">
          <div class="swatch-col">
            <span class="col-label">Sampled</span>
            <div class="swatch-box" id="sampled-swatch"></div>
          </div>
          <div class="swatch-col">
            <span class="col-label">INK COLOR Match</span>
            <div class="swatch-box" id="result-swatch"></div>
            <span class="match-name" id="result-name">&mdash;</span>
          </div>
        </div>
        <div class="alt-matches">
          <div class="alt-label">Other close matches &mdash; click to select</div>
          <div class="alt-grid" id="alt-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Palette -->
  <div class="step">
    <div class="step-header"><span class="step-header-text">Palette <span id="palette-count" style="font-size:14px;font-family:var(--mono);color:var(--muted);font-weight:400"></span></span></div>
    <div class="card">
      <div class="card-body">
        <div class="palette-grid" id="palette-grid">
          <div class="empty-palette">No colors yet &mdash; pick a color above and add it here</div>
        </div>
        <div class="palette-actions">
          <button class="copy-all-btn" onclick="copyAll()">Copy all INK COLOR codes</button>
          <button class="clear-btn" onclick="clearPalette()">Clear all</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
let currentMatch=null,currentSample=null,palette=[];

async function launchEyedropper(){
  if(!window.EyeDropper){alert('EyeDropper requires Chrome 95 or newer.');return}
  const btn=document.getElementById('pick-btn');btn.disabled=true;
  try{
    const dropper=new EyeDropper(),result=await dropper.open();
    const hex=result.sRGBHex.toUpperCase();currentSample=hex;await matchHex(hex);
  }catch(e){}
  finally{btn.disabled=false}
}

async function matchHex(hex){
  document.getElementById('status-bar').classList.add('visible');
  document.getElementById('status-text').textContent=`Matching ${hex}\u2026`;
  document.getElementById('result-card').classList.remove('visible');
  try{
    const r=await fetch('/api/match-pantone-hex',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hex})}),d=await r.json();
    if(!r.ok||d.error){alert(d.error||'Error');return}
    renderResult(hex,d.matches);
  }catch(e){alert('Error: '+e.message)}
  finally{document.getElementById('status-bar').classList.remove('visible')}
}

function renderResult(sampledHex,matches){
  if(!matches||matches.length===0)return;
  document.getElementById('sampled-swatch').style.background=sampledHex;
  selectMatch(matches[0]);
  const ag=document.getElementById('alt-grid');ag.innerHTML='';
  matches.slice(1).forEach((m,i)=>{
    const chip=document.createElement('div');chip.className='alt-chip';chip.id=`chip-${i}`;
    chip.innerHTML=`<div class="chip-swatch" style="background:${m.hex}"></div><span>${m.name.replace('PANTONE ','')}</span><span class="chip-de">&Delta;E ${m.delta_e}</span>`;
    chip.addEventListener('click',()=>{document.querySelectorAll('.alt-chip').forEach(c=>c.classList.remove('selected'));chip.classList.add('selected');selectMatch(m)});
    ag.appendChild(chip);
  });
  document.getElementById('result-card').classList.add('visible');
  document.getElementById('add-btn').disabled=false;
}

function selectMatch(m){
  currentMatch=m;
  const sn=m.name.replace('PANTONE ','');
  document.getElementById('result-swatch').style.background=m.hex;
  document.getElementById('result-name').textContent=sn;
}

function addToPalette(){
  if(!currentMatch)return;
  if(palette.some(p=>p.name===currentMatch.name)){
    const b=document.getElementById('add-btn');b.textContent='Already added';
    setTimeout(()=>b.textContent='+ Add to palette',1500);return;
  }
  palette.push({name:currentMatch.name,hex:currentMatch.hex});renderPalette();
  const b=document.getElementById('add-btn');b.textContent='\u2713 Added';
  setTimeout(()=>b.textContent='+ Add to palette',1200);
}

function removeFromPalette(name){palette=palette.filter(p=>p.name!==name);renderPalette()}
function clearPalette(){palette=[];renderPalette()}

function renderPalette(){
  const grid=document.getElementById('palette-grid'),count=document.getElementById('palette-count');
  count.textContent=palette.length?`\u2014 ${palette.length} color${palette.length!==1?'s':''}` :'';
  if(palette.length===0){grid.innerHTML='<div class="empty-palette">No colors yet &mdash; pick a color above and add it here</div>';return}
  grid.innerHTML='';
  palette.forEach(p=>{
    const sn=p.name.replace('PANTONE ',''),item=document.createElement('div');item.className='palette-item';
    item.innerHTML=`<div class="palette-swatch" style="background:${p.hex}"></div><span class="palette-name">${sn}</span><span class="palette-hex">${p.hex}</span><button class="remove-btn" onclick="removeFromPalette('${p.name}')">remove</button>`;
    grid.appendChild(item);
  });
}

function copyAll(){
  if(!palette.length)return;
  const text=palette.map(p=>p.name.replace('PANTONE ','')).join(', ');
  navigator.clipboard.writeText(text).then(()=>{
    const b=document.querySelector('.copy-all-btn');b.textContent='\u2713 Copied!';
    setTimeout(()=>b.textContent='Copy all INK COLOR codes',1500);
  });
}
</script>
<script src="/static/client.js" defer></script>
